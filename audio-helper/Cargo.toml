[package]
name = "telinha-audio"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_Variant", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "implement", "Win32_Security"] }
windows-core = "0.58"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
