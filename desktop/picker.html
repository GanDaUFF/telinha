<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Escolha o que compartilhar</title>
  <style>
    body { margin: 0; background: #0f1115; color: #e6e8ee; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 14px 16px 0; }
    h1 { font-size: 17px; margin: 0 0 10px; }
    .tabs { display: flex; gap: 6px; }
    .tabs button { background: #1f232c; color: #e6e8ee; border: 1px solid #2a2f3a; border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit; }
    .tabs button.on { background: #5865f2; border-color: #5865f2; }
    main { flex: 1; overflow: auto; padding: 14px 16px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); align-content: start; }
    .src { background: #171a21; border: 2px solid #2a2f3a; border-radius: 10px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
    .src:hover { border-color: #8b93a5; }
    .src.sel { border-color: #5865f2; }
    .src img.t { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; border-radius: 6px; }
    .src .n { display: flex; gap: 6px; align-items: center; font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .src .n img { width: 16px; height: 16px; flex-shrink: 0; }
    footer { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid #2a2f3a; }
    footer .hint { color: #8b93a5; font-size: 12px; }
    footer button { font: inherit; border-radius: 8px; padding: 8px 16px; cursor: pointer; border: 1px solid #2a2f3a; background: #1f232c; color: #e6e8ee; }
    footer button.primary { background: #5865f2; border-color: #5865f2; font-weight: 600; }
    footer button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Escolha o que compartilhar</h1>
    <div class="tabs"><button data-k="window" class="on">Janelas</button><button data-k="screen">Tela inteira</button></div>
  </header>
  <main id="grid"></main>
  <footer>
    <span class="hint">Dica: escolha a janela do jogo. O som vai sem o Discord (dá para mudar em ⚙ Configurações).</span>
    <span><button id="cancel">Cancelar</button> <button id="ok" class="primary" disabled>Compartilhar</button></span>
  </footer>
  <script>
    let list = [];
    let kind = 'window';
    let sel = null;
    const grid = document.getElementById('grid');
    function render() {
      grid.innerHTML = '';
      for (const s of list.filter((x) => x.kind === kind)) {
        const d = document.createElement('div');
        d.className = 'src' + (sel === s.id ? ' sel' : '');
        const t = document.createElement('img');
        t.className = 't';
        t.src = s.thumb;
        const n = document.createElement('div');
        n.className = 'n';
        if (s.icon) {
          const i = document.createElement('img');
          i.src = s.icon;
          n.append(i);
        }
        n.append(document.createTextNode(s.name));
        n.title = s.name;
        d.append(t, n);
        d.onclick = () => { sel = s.id; document.getElementById('ok').disabled = false; render(); };
        d.ondblclick = () => window.picker.choose(s.id);
        grid.append(d);
      }
    }
    for (const b of document.querySelectorAll('.tabs button')) {
      b.onclick = () => {
        kind = b.dataset.k;
        document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
        render();
      };
    }
    document.getElementById('cancel').onclick = () => window.picker.choose(null);
    document.getElementById('ok').onclick = () => sel && window.picker.choose(sel);
    window.picker.sources().then((l) => { list = l; render(); });
  </script>
</body>
</html>
